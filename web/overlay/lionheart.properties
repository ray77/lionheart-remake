# Settings for the browser run, packed into the assets.
#
# CAREFUL: nothing reads this file at the moment. Only the desktop launcher calls
# Settings.load, so the browser build runs on the built in defaults, and it has
# always done so. WebLionheart feeds in the one key it does need - the language -
# on its own. The values below are kept because they are the right ones should the
# file ever be loaded, but changing one here changes nothing today.
#
# Where the browser differs from the desktop:
#  - raster.type = DIRECT, because CACHE reads pre-rendered raster images from
#    disk that only a desktop run writes. Nothing writes in a browser.
#  - flag.parallel = false, one thread.
#  - flag.vsync = false, frames already arrive at the display's own rate.
resolution.windowed = true
filter = NONE
volume = 100
volume.music = 40
volume.sfx = 100
gameplay = ORIGINAL
gameplay.twobuttons = false
raster.type = DIRECT
raster.check = false
hud.visible = true
hud.sword = true
flicker.background = false
flicker.foreground = false
zoom = 1.15
flag.strategy = 0
flag.parallel = false
flag.vsync = false
flag.debug = false
